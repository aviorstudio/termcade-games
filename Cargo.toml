[workspace]
members = ["asteroid", "tetris", "brickough", "internal/random"]
resolver = "3"

[workspace.dependencies]
termcade-sdk = { git = "https://github.com/aviorstudio/termcade", rev = "c1885e18633072ad8e212ea8e3a4ba4240c0c2cf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[profile.release]
panic = "abort"
lto = "thin"
strip = true
