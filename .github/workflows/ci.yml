name: "Build & Test"

# Every push and pull request: test every game, then prove every one of them
# still packages.
#
# Building the .tcade is the part worth having. `go test` compiles for the host;
# a game only reaches a player as a wasip1 reactor module with the termcade ABI
# exported, and `dev build` is what checks that — it compiles for wasm and
# validates the module before zipping it. A game that tests green and cannot be
# packaged is broken in the only way that matters.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never let a workspace decide which sdk these games build against. A go.work
# (committed, or dropped next to the checkout) would silently swap the
# released sdk in go.mod for a local tree, and CI would go green on code a
# player cannot build. GOWORK=off forces module mode everywhere below, so
# what CI proves is what `go get github.com/aviorstudio/termcade-games` sees.
env:
  GOWORK: off

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: "Test"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record tested integration identity
        if: github.event_name == 'pull_request'
        uses: nicodes/tools/integration-identity@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Upload artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/fleet-integration.json
          if-no-files-found: error
          retention-days: 7
      - name: "Set up tools"
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Install pinned build and validation tools
        run: make install

      - name: Check every game and released-consumer package
        run: make check
