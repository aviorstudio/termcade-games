name: CI

# Every push and pull request: test every game, then prove every one of them
# still packages.
#
# Building the .tcade is the part worth having. `go test` compiles for the host;
# a game only reaches a player as a wasip1 reactor module with the termcade ABI
# exported, and `dev build` is what checks that — it compiles for wasm and
# validates the module before zipping it. A game that tests green and cannot be
# packaged is broken in the only way that matters.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never let a workspace decide which sdk these games build against. A go.work
# (committed, or dropped next to the checkout) would silently swap the
# released sdk in go.mod for a local tree, and CI would go green on code a
# player cannot build. GOWORK=off forces module mode everywhere below, so
# what CI proves is what `go get github.com/aviorstudio/termcade-games` sees.
env:
  GOWORK: off

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go vet ./...
      - run: go test ./...
      - name: Check release workflow policy
        run: python3 scripts/check-release-workflow.py .github/workflows/release.yml

      # Same pinned arcade the release workflow builds with, for the same
      # reason: what CI proves buildable is what a release will produce.
      - name: Package every game
        run: |
          set -euo pipefail
          for dir in ./*/termcade.toml; do
            game="${dir#./}"
            game="${game%/termcade.toml}"
            go run github.com/aviorstudio/termcade@v0.0.5 dev build "$game"
          done
          sha256sum ./*/build/*.tcade
