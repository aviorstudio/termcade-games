name: Release

# Cut one game's release: build its .tcade, tag it, and publish a GitHub
# release with the package attached.
#
# One game at a time, deliberately. This is a monorepo of independent games —
# fixing Tetris is no reason to re-release Asteroid, and a shared version
# number across unrelated games would be meaningless to the marketplace.
#
# Independent immutable tags remain `<game>-v1.2.3`.
#
# THE MANIFEST DECIDES THE VERSION. There is no bump input: the workflow reads
# `version` out of <game>/termcade.toml and refuses to run if that version is
# already tagged. The registry reads the same field out of the package it
# fetches, so a tag derived from anything else could disagree with what the
# marketplace ends up recording. Bump the manifest, merge, release.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a new version or republish the existing first-party catalog
        required: true
        type: choice
        default: publish
        options:
          - publish
          - republish
      game:
        description: Which game to release (publish mode)
        required: true
        type: choice
        options:
          - asteroid
          - brickough
          - tetris

permissions: {}

# Use the Rust toolchain and exact SDK revision locked by this repository.
env:
  RUSTUP_TOOLCHAIN: 1.94.0

concurrency:
  group: ${{ inputs.mode == 'republish' && 'recover-first-party-catalog' || format('release-{0}', inputs.game) }}
  cancel-in-progress: false

jobs:
  release:
    name: "Release"
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the release
      id-token: write # mint the short-lived signing identity
      attestations: write # publish package provenance
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Set up tools"
        uses: nicodes/tools/setup@71540eb673ebd47162de3b78bb6ffbf77605d2ab
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install pinned build and validation tools
        shell: bash
        run: |
          set -euo pipefail
          mise run install

      - name: Read the version out of the manifest
        id: version
        env:
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi

          manifest="crates/$GAME/termcade.toml"
          [ -f "$manifest" ] || { echo "no $manifest" >&2; exit 1; }

          # The one line that matters. Tolerates the spacing the manifests use.
          version="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$manifest" | head -n 1)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version in $manifest is '$version'; the registry needs plain semver like 1.2.3" >&2; exit 1 ;;
          esac

          tag="$GAME-v$version"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — bump version in $manifest first." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          mise run lint
          mise run test

      # The arcade is the build tool. Pinning it to a released version means a
      # package is built by a termcade a player could also be running, rather
      # than by whatever main happened to be that morning.
      - name: Build the package
        env:
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          bash scripts/build.sh "$GAME"
          python3 scripts/check-artifacts.py "$GAME"
          sha256sum "crates/$GAME/build/$GAME.tcade" | tee "crates/$GAME/build/$GAME.tcade.sha256"

      # Sign the package produced above, before either release publication or
      # marketplace publication. A failure here stops the release rather than
      # leaving an unattested first-party package behind.
      - name: "Attest build provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: crates/${{ inputs.game }}/build/${{ inputs.game }}.tcade

      - name: Verify package provenance policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAME: ${{ inputs.game }}
        run: |
          set -euo pipefail
          gh attestation verify "crates/$GAME/build/$GAME.tcade" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAME: ${{ inputs.game }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 < "crates/$GAME/build/$GAME.tcade.sha256")"
          cat > notes.md <<NOTES
          $GAME $VERSION

          Install it from the marketplace:

          \`\`\`sh
          termcade add aviorstudio/$GAME
          \`\`\`

          \`\`\`
          sha256  $sha
          \`\`\`

          The registry records that digest when it fetches this package, and
          the arcade refuses to install anything that does not match it.

          Verify the GitHub-hosted build provenance:

          \`\`\`sh
          gh attestation verify $GAME.tcade \\
            --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\
            --source-ref refs/heads/main \\
            --source-digest $GITHUB_SHA \\
            --signer-digest $GITHUB_SHA \\
            --deny-self-hosted-runners \\
            --predicate-type https://slsa.dev/provenance/v1
          \`\`\`
          NOTES

          gh release create "$TAG" \
            "crates/$GAME/build/$GAME.tcade" \
            "crates/$GAME/build/$GAME.tcade.sha256" \
            THIRD_PARTY_NOTICES.txt \
            --target "$GITHUB_SHA" --title "$GAME $VERSION" --notes-file notes.md

      # Tell the marketplace the release exists.
      #
      # After the GitHub release, not before: publishing is a claim that a
      # package is at these coordinates, and the registry verifies it by
      # fetching. Claiming first would have it fetch something that is not
      # there yet.
      #
      # A scoped publish key rather than a password. It publishes as
      # aviorstudio and can do nothing else — not read a library, not mint
      # another key, not touch an account — so what a leak costs is bounded by
      # this one handle.
      #
      # The secret is read into the environment and the step decides from
      # there, rather than through a step-level `if` on the secrets context —
      # that is the kind of expression that evaluates to something unhelpful
      # instead of failing loudly, and a publish step which silently never ran
      # would leave the marketplace quietly out of date.
      - name: Publish to the marketplace
        env:
          TERMCADE_TOKEN: ${{ secrets.TERMCADE_API_KEY }}
          GAME: ${{ inputs.game }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TERMCADE_TOKEN:-}" ]; then
            echo "::error::TERMCADE_API_KEY is not set — refusing to report a complete first-party release without marketplace publication. After restoring the scoped key, publish with: termcade publish https://github.com/$GITHUB_REPOSITORY $TAG $GAME.tcade" >&2
            exit 1
          fi
          .artifacts/termcade-tool/termcade publish \
            "https://github.com/$GITHUB_REPOSITORY" "$TAG" "$GAME.tcade"

  republish:
    name: Republish existing catalog
    if: inputs.mode == 'republish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Publish existing releases to the marketplace
        env:
          TERMCADE_API_KEY: ${{ secrets.TERMCADE_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          API = "https://api.termca.de"
          REPO = "https://github.com/aviorstudio/termcade-games"
          REQUIRED = (
              ("aviorstudio/asteroid", "asteroid-v0.1.1", "asteroid.tcade", "3e6191d1d8069e12323fc12d96edea8e96695a49cc64f291d4dfb598f666f25f"),
              ("aviorstudio/tetris", "tetris-v0.1.1", "tetris.tcade", "7b516fc1a6239b1ae0102a7824d7d32e8e42cccbe99147bae2b0ab03b7fb8eb4"),
              ("aviorstudio/brickough", "brickough-v0.1.1", "brickough.tcade", "51f8c6d6a1059a2b2c9397887fb0a836dc849928318ee04de7d4fdf1270f27d1"),
          )

          token = os.environ.get("TERMCADE_API_KEY", "")
          if not re.fullmatch(r"ak_[A-Za-z0-9_-]{17,509}", token):
              raise SystemExit("TERMCADE_API_KEY must be a Clerk publishing key")

          def request(method, path, body=None, authenticated=False):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type": "application/json"} if data else {}
              if authenticated:
                  headers["Authorization"] = "Bearer " + token
              req = urllib.request.Request(API + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None

          def exact(entry, game_id, tag, asset, digest):
              return entry is not None and all((
                  entry.get("id") == game_id,
                  entry.get("version") == tag.rsplit("-v", 1)[1],
                  entry.get("repo") == REPO,
                  entry.get("tag") == tag,
                  entry.get("asset") == asset,
                  entry.get("sha256") == digest,
                  entry.get("abi") == 1,
              ))

          for game_id, tag, asset, digest in REQUIRED:
              path = f"/v1/games/{game_id}/resolve?abi=1"
              status, current = request("GET", path)
              if status == 200:
                  if not exact(current, game_id, tag, asset, digest):
                      raise SystemExit(f"{game_id} exists but does not match the reviewed release")
                  print(f"{game_id} already restored; verifying publishing access")
              elif status != 404:
                  raise SystemExit(f"could not inspect {game_id}: HTTP {status}")

              status, _ = request("POST", "/v1/publish", {
                  "repo": REPO,
                  "tag": tag,
                  "asset": asset,
                  "expected_sha256": digest,
              }, authenticated=True)
              if status not in (201, 409):
                  raise SystemExit(f"recovery did not restore {game_id} exactly (HTTP {status})")
              status, published = request("GET", path)
              if status != 200 or not exact(published, game_id, tag, asset, digest):
                  raise SystemExit(f"recovery did not verify {game_id} exactly (HTTP {status})")
              print(f"restored {game_id} with its reviewed digest")
          PY
