[game]
id          = "aviorstudio/asteroid"
name        = "Asteroid"
version     = "0.0.2"
description = "Wrap-around space rock shooter"

[requirements]
abi    = 1  # termcade wasm ABI major version
width  = 72 # logical playfield; must match the game's Info
height = 40

[controls]
"←/→"   = "turn"
"↑"     = "thrust"
"space" = "fire"
